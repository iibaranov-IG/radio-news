[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-news"
version = "0.1.0"
description = "Fixture-only first independent vertical slice for radio-news"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
radio-news = "radio_news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"radio_news.fixtures" = ["*.xml"]
"radio_news.storage.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
