name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record CI provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          {
            echo "EVENT_NAME=${GITHUB_EVENT_NAME}"
            echo "CURRENT_RUN_ID=${GITHUB_RUN_ID}"
            echo "PR_HEAD_SHA=${PR_HEAD_SHA}"
            echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
            echo "BASE_SHA=${BASE_SHA}"
            echo "PYTHON_VERSION=$(python --version 2>&1)"
          } | tee ci-provenance.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Run contract tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee pytest-result.txt
          echo "TEST_RESULT=$(tail -n 1 pytest-result.txt)" >> ci-provenance.txt

      - name: Build wheel and sdist
        run: python -m build

      - name: Clean installed-wheel acceptance outside checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/radio-news-venv
          /tmp/radio-news-venv/bin/python -m pip install --upgrade pip
          /tmp/radio-news-venv/bin/python -m pip install dist/*.whl
          /tmp/radio-news-venv/bin/python -m pip check
          mkdir -p /tmp/radio-news-acceptance
          cd /tmp/radio-news-acceptance
          cat > config.json <<'JSON'
          {"source":{"source_id":"fixture-kp","display_name":"Fixture KP","source_type":"rss_fixture","enabled":true,"trust_class":"TEST","fixture_resource":"sample.xml"}}
          JSON
          /tmp/radio-news-venv/bin/radio-news run-fixture --config config.json --database radio-news.sqlite --editor ci-editor --now 2026-08-03T10:00:00Z > first-run.json
          cp radio-news.sqlite before-http.sqlite
          /tmp/radio-news-venv/bin/radio-news serve --database radio-news.sqlite --host 127.0.0.1 --port 8765 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz > healthz.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ > feed.html
          curl -fsS http://127.0.0.1:8765/api/feed > feed.json
          STORY_PATH=$(/tmp/radio-news-venv/bin/python - <<'PY'
          import json
          import urllib.parse
          from pathlib import Path
          payload=json.loads(Path('feed.json').read_text(encoding='utf-8'))
          print(urllib.parse.quote(payload['items'][0]['story_id'], safe=''))
          PY
          )
          curl -fsS "http://127.0.0.1:8765/stories/${STORY_PATH}" > story.html
          curl -fsS "http://127.0.0.1:8765/api/stories/${STORY_PATH}" > story.json
          kill $SERVER_PID
          wait $SERVER_PID || true
          trap - EXIT
          cmp before-http.sqlite radio-news.sqlite
          /tmp/radio-news-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          feed_html = Path('feed.html').read_text(encoding='utf-8')
          feed = json.loads(Path('feed.json').read_text(encoding='utf-8'))
          story_html = Path('story.html').read_text(encoding='utf-8')
          story = json.loads(Path('story.json').read_text(encoding='utf-8'))
          assert 'КПNEWS' in feed_html and 'Fixture KP' in feed_html and 'READY' in feed_html
          assert feed['count'] == 1
          assert feed['items'][0]['source_id'] == 'fixture-kp'
          assert feed['items'][0]['story_id'] == story['story']['id']
          for marker in ('Story','Source','RawItem','NormalizedItem','Claim','Fact','VerificationResult','Provenance'):
              assert marker in story_html
          assert story['sources'][0]['source_id'] == 'fixture-kp'
          assert story['raw_items'] and story['normalized_items'] and story['claims'] and story['facts']
          assert story['verification_results'][0]['status'] == 'READY'
          assert {'supported_by','evaluated_by'} <= {edge['relation'] for edge in story['provenance']}
          PY
          echo "INSTALLED_P1_BROWSER_ACCEPTANCE=success" >> "$GITHUB_WORKSPACE/ci-provenance.txt"
          echo "INSTALLED_P2_STORY_EVIDENCE_ACCEPTANCE=success" >> "$GITHUB_WORKSPACE/ci-provenance.txt"

      - name: Prove no Horizon runtime dependency
        run: |
          if git grep -nE '(^|[[:space:]])(from|import)[[:space:]]+(horizon|src)([[:space:].]|$)' -- src tests; then exit 1; fi
          python - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as handle:
              deps=tomllib.load(handle)['project'].get('dependencies',[])
          assert not any('horizon' in d.lower() for d in deps)
          PY

      - name: Verify successful exact-head push run
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['PR_HEAD_SHA']; branch=urllib.parse.quote(os.environ['HEAD_BRANCH'],safe='')
          url=f'https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?branch={branch}&event=push&per_page=20'
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','User-Agent':'radio-news-ci'}
          selected=None
          for _ in range(60):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response: payload=json.load(response)
              matches=[r for r in payload.get('workflow_runs',[]) if r.get('head_sha')==sha and r.get('event')=='push']
              if matches:
                  selected=max(matches,key=lambda r:r['id'])
                  if selected.get('status')=='completed': break
              time.sleep(5)
          if not selected or selected.get('conclusion')!='success': raise SystemExit(f'exact-head push run not successful: {selected}')
          print(json.dumps({'run_id':selected['id'],'head_sha':selected['head_sha'],'conclusion':selected['conclusion']}))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-ci-${{ github.run_id }}
          path: |
            ci-provenance.txt
            pytest-result.txt
            /tmp/radio-news-acceptance/feed.html
            /tmp/radio-news-acceptance/feed.json
            /tmp/radio-news-acceptance/story.html
            /tmp/radio-news-acceptance/story.json
            /tmp/radio-news-acceptance/server.log
